plugins {
    id 'com.android.library'
}

android {
    namespace = "com.live2d.sdk.cubism.framework"
    // Use project property PROP_COMPILE_SDK_VERSION if defined, otherwise default to 33
    def _propCompileSdk = project.hasProperty('PROP_COMPILE_SDK_VERSION') ? project.property('PROP_COMPILE_SDK_VERSION').toString().toInteger() : 36
    compileSdk _propCompileSdk

    defaultConfig {
        minSdkVersion (project.hasProperty('PROP_MIN_SDK_VERSION') ? project.property('PROP_MIN_SDK_VERSION').toString().toInteger() : 24)
        targetSdkVersion (project.hasProperty('PROP_TARGET_SDK_VERSION') ? project.property('PROP_TARGET_SDK_VERSION').toString().toInteger() : 34)
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_7
        targetCompatibility JavaVersion.VERSION_1_7
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    compileOnly(fileTree(dir: '../core', include: ['Live2DCubismCore.aar']))

    testImplementation 'junit:junit:4.13.2'
}
